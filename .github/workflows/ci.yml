name: OrchidApp CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:

  lifecycle-closure:
    name: Lifecycle closure, read-only and structural transactions
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Check upgraded and schema-only lifecycle policy with actual HTTP
        shell: pwsh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: root
          MARIADB_PASSWORD: root
        run: |
          ./tests/LifecycleClosure.Checks/Database.Checks.ps1
          ./tests/DevelopmentSetup.Checks/DatabaseUpdate.Checks.ps1

  linux-backup:
    name: Linux paired backup and recovery
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install backup test tools
        run: sudo apt-get update && sudo apt-get install -y mariadb-client rclone
      - name: Check Linux backup wrapper syntax
        run: |
          bash -n infrastructure/backups/backup_orchids.sh
          bash -n infrastructure/backups/restore_orchids.sh
          bash infrastructure/backups/backup_orchids.sh --help
          bash infrastructure/backups/restore_orchids.sh --help
      - name: Check paired snapshots and isolated recovery
        shell: pwsh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: root
          MARIADB_PASSWORD: root
        run: ./tests/LinuxBackup.Checks/Database.Checks.ps1

  build:
    name: Build (linux-arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/OrchidApp.Web -r linux-arm64

      - name: Build
        run: |
          echo "Building OrchidApp..."
          dotnet build src/OrchidApp.Web --configuration Release --no-restore -r linux-arm64

      - name: Publish linux-arm64
        run: |
          echo "Publishing linux-arm64..."
          dotnet publish src/OrchidApp.Web \
            -c Release \
            -r linux-arm64 \
            --self-contained false \
            --no-restore \
            -o publish

      - name: Verify publish output
        run: |
          if [ ! -f publish/OrchidApp.Web.dll ]; then
            echo "Publish output missing"
            exit 1
          fi

      - name: Check development configuration
        shell: pwsh
        run: |
          ./tests/DevelopmentSetup.Checks/Configuration.Checks.ps1
          ./tests/DevelopmentSetup.Checks/DotEnv.Checks.ps1

      - name: Check direct Development startup configuration
        run: dotnet run --configuration Release --project tests/DevelopmentConfiguration.Checks/DevelopmentConfiguration.Checks.csproj

      - name: Install native photo dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-tools

      - name: Check native photo save and reopen
        env:
          Storage__UploadRoot: ${{ runner.temp }}/orchidapp-native-check
        run: dotnet run --configuration Release --project tests/DevelopmentNative.Checks/DevelopmentNative.Checks.csproj

      - name: Check schema baseline policy
        run: dotnet run --configuration Release --project tests/SchemaBaseline.Checks/SchemaBaseline.Checks.csproj

      - name: Check Desktop migration policy
        run: dotnet run --configuration Release --project tests/MigrationHistory.Checks/MigrationHistory.Checks.csproj


  schema-contract:
    name: Schema contract validation
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Create canonical database from schema and seeds only
        shell: pwsh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_DATABASE: orchids
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_CHARSET: utf8mb4
          MARIADB_COLLATION: utf8mb4_unicode_ci
        run: |
          $stage = Join-Path $env:RUNNER_TEMP ('schema-only-' + [guid]::NewGuid().ToString('N'))
          $database = Join-Path $stage 'database'
          New-Item -ItemType Directory -Path $database | Out-Null
          foreach ($directory in @('scripts','schema')) {
            Copy-Item -LiteralPath (Join-Path $PWD "database/$directory") -Destination $database -Recurse
          }
          if (Test-Path -LiteralPath (Join-Path $database 'migrations')) { throw 'Creation stage must not contain migrations.' }
          & (Join-Path $database 'scripts/rebuild.ps1') -ConfirmDatabase $env:MARIADB_DATABASE

      - name: Check schema-only seeded creation and future upgrade
        shell: pwsh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: root
          MARIADB_PASSWORD: root
        run: ./tests/SchemaBaseline.Checks/Database.Checks.ps1

      - name: Check MariaDB tool resolution
        shell: pwsh
        run: ./tests/SchemaBaseline.Checks/ToolResolution.Checks.ps1

      - name: Check PowerShell migration policy
        shell: pwsh
        run: ./tests/MigrationHistory.Checks/Policy.Checks.ps1

      - name: Check migration execution and failed-DDL handling
        shell: pwsh
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: root
          MARIADB_PASSWORD: root
        run: ./tests/MigrationHistory.Checks/Database.Checks.ps1

      - name: Run schema export
        env:
          MARIADB_DATABASE: orchids
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_USER: root
          MARIADB_PASSWORD: root
        run: pwsh ./database/scripts/Export-MariaDBSchema.ps1

      - name: Detect drift
        run: |
          if [[ -n $(git diff -w --ignore-blank-lines) ]]; then
            echo "Schema drift detected!"
            git status
            git --no-pager diff -w --ignore-blank-lines
            exit 1
          fi

      - name: Schema validation passed
        run: echo "Schema is deterministic and valid"

  windows-package:
    name: Windows package validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows runtime dependencies
        shell: pwsh
        run: ./scripts/restore-windows-runtime.ps1
      
      - name: Check development configuration
        shell: pwsh
        run: |
          ./tests/DevelopmentSetup.Checks/Configuration.Checks.ps1
          ./tests/DevelopmentSetup.Checks/DotEnv.Checks.ps1

      - name: Check direct Development startup configuration
        run: dotnet run --configuration Release --project tests/DevelopmentConfiguration.Checks/DevelopmentConfiguration.Checks.csproj

      - name: Check native photo save and reopen
        shell: pwsh
        env:
          Storage__UploadRoot: ${{ runner.temp }}/orchidapp-native-check
        run: |
          $env:PATH = (Join-Path $PWD 'app/runtime/libvips/win-x64/bin') + [IO.Path]::PathSeparator + $env:PATH
          dotnet run --configuration Release --project tests/DevelopmentNative.Checks/DevelopmentNative.Checks.csproj

      - name: Check legacy source capture
        run: dotnet run --configuration Release --project tests/BackupRestore.Checks/BackupRestore.Checks.csproj

      - name: Check Windows backup payload compatibility
        shell: pwsh
        run: |
          ./tests/BackupRestore.Checks/Policy.Checks.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/BackupRestore.Checks/Policy.Checks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows backup retention
        shell: pwsh
        run: |
          ./tests/BackupRestore.Checks/Retention.Checks.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/BackupRestore.Checks/Retention.Checks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows backup and restore round trip
        shell: pwsh
        run: ./tests/BackupRestore.Checks/Database.Checks.ps1 -MariaDbRuntimeRoot ./app/runtime/mariadb/win-x64

      - name: Create Windows package
        shell: pwsh
        run: ./scripts/package-windows.ps1
